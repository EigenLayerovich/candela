<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candela Charts</title>
  <meta name="description" content="Free, open charting with every indicator unlocked.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D8BFD'/%3E%3Cpath d='M9 8v16M9 12h-0M16 6v20M23 10v12' stroke='white' stroke-width='2'/%3E%3Crect x='7' y='12' width='4' height='7' fill='white'/%3E%3Crect x='14' y='10' width='4' height='11' fill='white'/%3E%3Crect x='21' y='13' width='4' height='6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" title="Candela Charts">
      <svg viewBox="0 0 24 24"><path d="M6 4v16M12 2v20M18 6v12"/><rect x="4.5" y="8" width="3" height="7"/><rect x="10.5" y="6" width="3" height="10"/><rect x="16.5" y="9" width="3" height="5"/></svg>
    </div>
    <button id="symbolBtn" class="symbol-btn" title="Symbol search (just start typing)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span id="symbolName">BTCUSDT</span>
      <span id="symbolEx" class="sym-ex"></span>
    </button>
    <div class="sep"></div>
    <div id="tfGroup" class="tf-group"></div>
    <select id="tfMore" class="tf-more" title="More timeframes"></select>
    <div class="sep"></div>
    <select id="chartType" class="select" title="Chart type">
      <option value="candles">Candles</option>
      <option value="hollow">Hollow candles</option>
      <option value="heikin">Heikin Ashi</option>
      <option value="bars">Bars</option>
      <option value="line">Line</option>
      <option value="area">Area</option>
      <optgroup label="Price-only (no time)">
        <option value="renko">Renko</option>
        <option value="kagi">Kagi</option>
        <option value="pnf">Point &amp; Figure</option>
      </optgroup>
    </select>
    <button id="brickBtn" class="hbtn small" title="Box size and reversal" hidden>Box…</button>
    <button id="layoutBtn" class="hbtn icon" title="Chart layout and sync"></button>
    <button id="indBtn" class="hbtn" title="Indicators (/)">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg><span>Indicators</span>
    </button>
    <button id="scriptBtn" class="hbtn" title="Write custom indicators">
      <svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg><span>Scripts</span>
    </button>
    <button id="compareBtn" class="hbtn" title="Compare with another symbol">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 5-6"/><path d="M3 12l5 2 4-4 5 1" stroke-dasharray="2 2.2"/><path d="M19 4v6M16 7h6"/></svg><span>Compare</span>
    </button>
    <button id="alertBtn" class="hbtn" title="Create alert (Alt+A)">
      <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span>Alert</span>
    </button>
    <div class="spacer"></div>
    <button id="pctBtn" class="hbtn small" title="Percent scale">%</button>
    <button id="logBtn" class="hbtn small" title="Logarithmic price scale">log</button>
    <button id="autoBtn" class="hbtn small" title="Reset view (Alt+R)">reset</button>
    <button id="snapBtn" class="hbtn icon" title="Save snapshot (PNG)">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button id="themeBtn" class="hbtn icon" title="Toggle light / dark">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
    <span id="status" class="status" data-state="loading" title="Data connection"><i></i><span>Loading</span></span>
    <button id="sideBtn" class="hbtn icon" title="Toggle watchlist">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </header>

  <div class="main">
    <nav id="toolbar" class="toolbar" aria-label="Drawing tools"></nav>
    <section class="chart-wrap">
      <div id="charts" class="charts" data-layout="1"></div>
    </section>
    <aside id="side" class="side">
      <div class="side-sec grow">
        <div class="side-head"><span>Watchlist</span><button id="wlAdd" class="icon-btn" title="Add symbol">+</button></div>
        <div class="wl-cols"><span>Symbol</span><span>Last</span><span>24h</span></div>
        <div id="watchlist" class="scroll"></div>
      </div>
      <div class="side-sec" id="acrossSec">
        <div class="side-head"><button id="acrossToggle" class="side-fold" aria-expanded="true"><span id="acrossTitle">Across exchanges</span></button><span id="acrossNote" class="muted small"></span></div>
        <div id="across" class="scroll across"></div>
      </div>
      <div class="side-sec">
        <div class="side-head"><span>Alerts</span><button id="serverBtn" class="srv-pill" title="Alert server">This tab only</button></div>
        <div id="alertList" class="scroll alerts"></div>
      </div>
    </aside>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <div id="ctxMenu" class="ctx hidden"></div>
  <div id="layoutMenu" class="popover hidden"></div>
  <input type="file" id="csvInput" accept=".csv,.txt,text/csv" hidden>

  <script src="js/indicators.js"></script>
  <script src="js/data.js"></script>
  <script src="js/exchanges.js"></script>
  <script src="js/drawings.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/script.js"></script>
  <script src="js/alerts-core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
